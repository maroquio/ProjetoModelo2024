{% extends "shared/base_privada.html" %}
{% block subtitulo %}Meus Professores{% endblock %}
{% block conteudo %}
<h1>Meus Professores</h1>
<hr>
<div class="row row-cols-4">
    {% for p in professores %}
    <div class="col">
        <div class="card">
            <div class="card-header">
                {{p.nome}}
            </div>
            <div class="card-body">
                {{p.email}} <br>
                {{p.telefone}}
            </div>
            <div class="card-footer">
                <a href="/usuario/{{p.id}}" class="btn btn-primary">Ver Detalhes</a>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
